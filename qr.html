<title>리스크관리 포털 QR코드</title>
<style>
:root{--ink:#1e1b4b;--sub:#4b5563;--bg1:#eef2ff;--bg2:#f5f3ff;--accent:#4338ca}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;padding:3vmin;text-align:center}
h1{margin:0;font-size:clamp(22px,5vmin,48px);font-weight:800;letter-spacing:-.02em}
.lead{margin:0;font-size:clamp(15px,2.6vmin,26px);color:var(--sub)}
.card{background:#fff;border-radius:3vmin;padding:2.4vmin;box-shadow:0 1.2vmin 5vmin rgba(67,56,202,.22);line-height:0}
.card svg{display:block;width:min(66vmin,92vw);height:min(66vmin,92vw);shape-rendering:crispEdges}
.url{font-size:clamp(14px,2.8vmin,28px);font-weight:700;color:var(--accent);word-break:break-all;margin:0}
.tag{display:inline-block;font-size:clamp(12px,1.8vmin,18px);background:#ede9fe;color:#3730a3;border-radius:99px;padding:.35em 1em;font-weight:700}
.tools{display:flex;gap:10px}
button{font:inherit;font-size:15px;font-weight:700;color:var(--accent);background:#fff;border:2px solid var(--accent);border-radius:10px;padding:8px 16px;cursor:pointer}
button:hover{background:#eef2ff}
button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
body.fs .tools{display:none}
@media print{body{background:#fff}.tools{display:none}.card{box-shadow:none;border:2px solid #000}}
</style>
